id: SEM_LIGHT_ADMISSION
lang: de
category: SEMANTIC
description: "Leichtes Eingeständnis eines Versäumnisses oder Fehlers."
frame:
  signal: ["hab vergessen", "ups", "mein Fehler"]
  concept: "Eingeständnis"
  pragmatics: "Beziehungswahrung durch Offenheit"
  narrative: "sanfte_entschuldigung"
composed_of:
- ATO_APOLOGY
activation_logic: "ANY 1 IN 3 messages"
scoring: {base: 1.4, weight: 1.1}
patterns:
- type: regex
  value: (?i)\b(hab|habe|hatte)\s+(das|es)?\s*vergessen\b
- type: regex
  value: (?i)\b(mein\s+(fehler|schuld|mist|versehen)|das\s+war\s+mein\s+fehler)\b
- type: keyword
  value: "ups"
- type: keyword
  value: "huch"
examples:
  positive:
  - "Ups, ganz vergessen dir zu schreiben."
  - "Mein Fehler, hätte ich vorher sagen sollen."
  - "Sorry, das hab ich übersehen."
  - "Huch, vergessen den Anhang mitzuschicken."
  - "Oh, da war ich wohl unaufmerksam."
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags: [semantic, emotional, admission]
