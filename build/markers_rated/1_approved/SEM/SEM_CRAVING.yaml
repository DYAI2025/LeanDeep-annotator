id: SEM_CRAVING
lang: de
category: SEMANTIC
description: "Ausdruck von Appetit oder Lust auf etwas."
frame:
  signal: ["hab Lust auf", "könnte gerade", "brauch jetzt unbedingt"]
  concept: "Verlangen"
  pragmatics: "Selbstoffenbarung eines Bedürfnisses"
  narrative: "sehnsucht"
composed_of:
- ATO_SUBSTANCE_CRAVING
activation_logic: "ANY 1 IN 3 messages"
scoring: {base: 1.4, weight: 1.1}
patterns:
- type: regex
  value: (?i)\b(hab|habe|hätte|hätt)\s+(lust|bock)\s+auf\b
- type: regex
  value: (?i)\bkönnte?\s+(gerade|jetzt)\s+\w+\s*(gut\s+)?(gebrauchen|haben|brauchen)\b
- type: regex
  value: (?i)\brauch\w*\s+(jetzt|unbedingt|dringend)\s+\w+\b
- type: keyword
  value: "Sehnsucht nach"
examples:
  positive:
  - "Ich hab so Lust auf Schokolade."
  - "Könnte jetzt echt ein Bier gebrauchen."
  - "Brauch unbedingt einen Kaffee."
  - "Hätte gerade gern eine Massage."
  - "Sehnsucht nach einem Strandurlaub."
  negative:
  - Ich denke, wir sollten das sachlich betrachten.
  - Mir geht es gut, danke der Nachfrage.
  - Das ist ein interessanter Gedanke.
  - Ich bin gerade entspannt.
  - Alles in Ordnung bei mir.
  - Ich fuehle mich heute ruhig und gelassen.
  - Das ueberrascht mich, aber es ist okay.
tags: [semantic, emotional, craving]
