id: ATO_PERSONAL_INTEREST_SHARE
lang: de
category: SEMANTIC
description: "Teilen einer persönlichen Freizeitaktivität oder eines Hobbys."
frame:
  signal: ["ich spiele", "ich lese", "ich bastle", "ich fahre"]
  concept: "Persönliches Interesse"
  pragmatics: "Selbstoffenbarung zur Beziehungspflege"
  narrative: "freizeit"
patterns:
- type: regex
  value: (?i)\b(ich\s+)?(spiele?\w*|lese?|bastle?\w*|fahre?\w*|koche?\w*|zeichne?\w*|singe?\w*|nähe?\w*)\s+(gern|gerne|lieber|manchmal|oft)\b
- type: regex
  value: (?i)\b(mein\s+(hobby|lieblingsbeschäftigung|sport|interesse)\s+(ist|sind|war))\b
- type: regex
  value: (?i)\bich\s+(spiele|lese|bastle|koche|zeichne|male|fahre|singe)\s+(gern|gerne|oft|manchmal|lieber)\b
activation_logic: "ANY 1 IN 3 messages"
scoring: {base: 1.4, weight: 1.1}
examples:
  positive:
  - "Ich spiele gern Gitarre."
  - "Ich lese gerade einen spannenden Krimi."
  - "Ich bastle an einem Modellflugzeug."
  - "Ich fahre oft mit dem Rad an den See."
  - "Ich koche gern neue Rezepte."
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags: [semantic, action, hobby]
