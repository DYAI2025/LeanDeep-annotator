id: ATO_DAILY_ROUTINE_REPORT
schema: LeanDeep
version: '5.1'
layer: ATO
lang: de
description: Bericht über aktuelle oder jüngste Alltagsaktivitäten.
frame:
  signal:
  - war beim
  - hab gerade
  - bin gerade dabei
  concept: Tagesablauf
  pragmatics: Teilen von Alltagsinformationen
  narrative: statusbericht
patterns:
- type: regex
  value: (?i)\b(war|bin|hab|habe)\s+(gerade|grad|kurz|eben)\s+(beim|einkaufen|spazieren|kochen|sport|training|joggen|laufen)\b
- type: regex
  value: (?i)\b(hab|habe)\s+(gerade|grad|eben)\s+(eingekauft|gekocht|aufgeräumt|trainiert|gebracht|gemacht)\b
- type: regex
  value: (?i)\b(war\s+(heute|gerade|grad|eben)\s+(beim|im|an|im\s+laden))\b
examples:
  positive:
  - War gerade einkaufen.
  - Hab gerade das Abendessen vorbereitet.
  - Bin noch beim Sport.
  - War mit dem Hund draußen.
  - Hab den ganzen Tag im Garten gearbeitet.
  negative:
  - Ich finde, wir sollten das in Ruhe besprechen.
  - Das ist ein guter Punkt, den du da machst.
  - Ich verstehe deine Perspektive.
  - Lass uns gemeinsam eine Loesung finden.
  - Mir ist aufgefallen, dass wir unterschiedlich denken.
  - Ich moechte verstehen, was du meinst.
  - Das klingt nach einem wichtigen Thema fuer dich.
tags:
- semantic
- action
- routine
rating: 1
scoring:
  base: 1.4
  weight: 1.1
activation:
  rule: "ANY 1 IN 3 messages"
